<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 110" width="520" height="110" fill="none">
  <!-- Universal Hotels Australia - Master White Official Logo -->
  <g fill="#FFFFFF" stroke="#FFFFFF">
    <!-- Crescent Plate Swoop -->
    <path 
      d="M 74 6 
         C 46 12, 22 30, 12 54 
         C 4 78, 16 100, 44 107 
         C 68 111, 92 104, 108 90 
         C 102 92, 84 100, 62 98 
         C 38 96, 24 82, 24 64 
         C 25 46, 42 24, 74 6 Z" 
      stroke="none"
    />
    
    <!-- 1. Spoon -->
    <line x1="22" y1="58" x2="60" y2="20" stroke-width="2.8" stroke-linecap="round"/>
    <path 
      d="M 58 22 
         C 55 16, 59 8, 67 5 
         C 75 2, 83 7, 85 14 
         C 87 21, 80 29, 72 31 
         C 65 33, 60 27, 58 22 Z" 
      stroke="none"
    />

    <!-- 2. Fork -->
    <line x1="33" y1="75" x2="66" y2="42" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Fork base and 3 sharp tines -->
    <path 
      d="M 64 44 
         L 67 41 
         L 74 48 
         L 84 38 
         L 82 36 
         L 74 44 
         L 72 42 
         L 81 33 
         L 79 31 
         L 70 40 
         L 68 38 
         L 77 29 
         L 75 27 
         L 65 37 
         C 62 40, 61 43, 64 44 Z" 
      stroke="none"
    />

    <!-- 3. Knife -->
    <!-- Handle extending beyond crescent at bottom-left -->
    <line x1="10" y1="116" x2="58" y2="68" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Knife blade -->
    <path 
      d="M 58 68 
         L 88 38 
         C 87 36, 84 37, 80 40 
         C 70 47, 58 60, 54 68 
         C 53 71, 56 72, 58 68 Z" 
      stroke="none"
    />

    <!-- Wordmark: UNIVERSAL HOTELS -->
    <text 
      x="122" 
      y="67" 
      font-family="Montserrat, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
      font-size="34" 
      font-weight="900" 
      letter-spacing="2.8" 
      stroke="none"
    >UNIVERSAL HOTELS</text>
  </g>
</svg>
