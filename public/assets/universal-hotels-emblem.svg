<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- Universal Hotels Australia - Official Insignia / Emblem -->
  <g fill="#000000" stroke="#000000">
    <!-- Crescent Plate Swoop -->
    <path 
      d="M 80 8 
         C 50 14, 24 34, 14 60 
         C 4 86, 18 110, 48 117 
         C 74 121, 100 114, 116 98 
         C 110 100, 90 109, 66 107 
         C 40 105, 26 90, 26 70 
         C 27 50, 46 26, 80 8 Z" 
      stroke="none"
    />
    
    <!-- 1. Spoon -->
    <line x1="24" y1="64" x2="66" y2="22" stroke-width="3" stroke-linecap="round"/>
    <path 
      d="M 64 24 
         C 61 17, 65 9, 74 5 
         C 83 2, 91 8, 93 15 
         C 95 23, 88 31, 79 34 
         C 71 36, 66 30, 64 24 Z" 
      stroke="none"
    />

    <!-- 2. Fork -->
    <line x1="36" y1="82" x2="72" y2="46" stroke-width="3" stroke-linecap="round"/>
    <!-- Fork base and 3 sharp tines -->
    <path 
      d="M 70 48 
         L 73 45 
         L 81 53 
         L 92 42 
         L 90 40 
         L 81 49 
         L 79 47 
         L 89 37 
         L 87 35 
         L 77 45 
         L 75 43 
         L 85 33 
         L 83 31 
         L 71 42 
         C 68 45, 67 48, 70 48 Z" 
      stroke="none"
    />

    <!-- 3. Knife -->
    <!-- Handle extending beyond crescent at bottom-left -->
    <line x1="12" y1="126" x2="64" y2="74" stroke-width="3" stroke-linecap="round"/>
    <!-- Knife blade -->
    <path 
      d="M 64 74 
         L 96 42 
         C 95 40, 92 41, 88 44 
         C 77 52, 64 66, 60 74 
         C 59 77, 62 78, 64 74 Z" 
      stroke="none"
    />
  </g>
</svg>
